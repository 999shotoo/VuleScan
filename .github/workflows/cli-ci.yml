name: CLI CI

on:
  push:
    paths:
      - 'apps/cli/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/cli-ci.yml'

jobs:
  build-and-typecheck-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build --workspace apps/cli

      - name: Typecheck CLI
        run: npx tsc --noEmit -p apps/cli/tsconfig.json
